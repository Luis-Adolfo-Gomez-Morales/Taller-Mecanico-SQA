    <main class="contenido"><header class="dashboard-title"><h1>Mecanicos</h1></header>
    <section class="dashboard-panel history-panel"><form id="formMecanico" class="work-order-form">
    <h2 id="mecanicoTitulo">Nuevo mecanico</h2><div class="form-grid three">
<label>Nombre<input id="mecanico_nombre" name="nombre" type="text" required maxlength="150"></label><label>Edad<input id="mecanico_edad" name="edad" type="number" required min="18" max="100"></label><label>DPI<input id="mecanico_dpi" name="dpi" type="text" required pattern="[0-9]{13}" maxlength="13" spellcheck="false"></label><label>Correo<input id="mecanico_correo" name="correo" type="email" required maxlength="150"></label><label>Direccion<input id="mecanico_direccion" name="direccion" type="text" required maxlength="255"></label><label>Fecha de contratacion<input id="mecanico_fecha_contratacion" name="fecha_contratacion" type="date" required ></label></div><p>La fecha de registro se genera automaticamente.</p><button type="submit" class="module-action">Guardar mecanico</button><button id="mecanicoNuevo" type="button" class="module-action">Nuevo</button></form></section>
    <section class="dashboard-panel history-panel"><label>Buscar<input id="buscarMecanico" type="search" placeholder="Nombre o DPI"></label><p id="mecanicosEstado" role="status"></p><div class="history-scroll"><table class="data-table"><thead><tr><th>Nombre</th><th>Edad</th><th>DPI</th><th>Correo</th><th>Direccion</th><th>Contratacion</th><th>Registro</th><th>Detalle</th></tr></thead><tbody id="tablaMecanicos"></tbody></table></div></section></main>
