
name: Calidad de Software - Taller Mecanico

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas automatizadas y calidad
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Analizar codigo con ESLint
        run: npm run lint

      - name: Ejecutar pruebas y medir cobertura
        run: npm run test:coverage

      - name: Verificar cobertura minima
        run: |
          node --test --experimental-test-coverage \
            --test-coverage-include='src/**/*.js' \
            --test-coverage-lines=60 \
            tests/*.test.js
